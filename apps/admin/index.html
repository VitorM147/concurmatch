<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/ 'sha256-oakrEaZuTPtt6RLR77PZ+eATGXE8eYi7v6C3SfX8skE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ConMatch · Suporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap">
<!--
  Painel do suporte do ConMatch.
  * Abra este arquivo no navegador (ou hospede em um endereço privado).
  * Na primeira vez, informe a URL do projeto e a chave PÚBLICA (anon) do Supabase.
    Nunca use a chave service_role aqui.
  * Entre com um usuário cadastrado em public.admins:
      insert into public.admins (user_id) values ('<uuid>');
  * Tudo passa pelas funções admin_* do banco, que conferem se você é admin
    e registram quem decidiu.
-->
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --line:#D6DEF0; --chip:#E0E7FF;
  --ink:#0B2545; --text:#1F2937; --muted:#4B5563; --accent:#F43F5E;
  --danger:#B91C1C; --ok:#15803D; --warn:#B45309;
  --f-display:"Playfair Display",Georgia,serif; --f-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#061629; --surface:#0B2545; --line:#1E3A66; --chip:#13315C;
  --ink:#F8FAFC; --text:#E5EAF5; --muted:#B6C2DA; --accent:#FB7185;
  --danger:#FCA5A5; --ok:#4ADE80; --warn:#FBBF24; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--f-body)}
header{position:sticky;top:0;z-index:2;background:var(--ink);color:#F8FAFC;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
header h1{font-family:var(--f-display);font-size:20px;margin:0}
header h1 em{color:var(--accent)}
header .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;opacity:.9;font-variant-numeric:tabular-nums}
header .sp{flex:1}
header button{background:transparent;border:1px solid rgba(248,250,252,.4);color:#F8FAFC}
nav{display:flex;gap:6px;padding:12px 20px 0}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:16px 20px 40px;display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
button{font:600 13px var(--f-body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-direction:column;gap:4px;text-align:left;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%}
.item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.p1{background:var(--danger);color:#fff}.p2{background:var(--accent);color:#fff}.p3{background:var(--warn);color:#fff}
.muted{color:var(--muted)}
h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;color:var(--ink)}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.photos img{width:150px;height:200px;object-fit:cover;border-radius:10px;background:var(--chip)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding:10px;background:var(--bg);border-radius:10px}
.msg{max-width:80%;padding:6px 10px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.r{align-self:flex-start;background:var(--chip);color:var(--ink)}
.msg.d{align-self:flex-end;background:var(--ink);color:var(--bg)}
.report{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
textarea,input{width:100%;font:14px var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
.empty{padding:30px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.err{color:var(--danger);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<!-- SRI: o navegador recusa o arquivo se a CDN entregar qualquer byte diferente (sha384 do pacote npm 2.45.4) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(() => {
  // ------------------------------------------------------------ util
  const $app = document.getElementById('app');
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;   // textos sempre via append (nunca innerHTML): conteúdo de usuário não vira HTML
  };
  const fmt = (d) => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const LABEL = {
    '1-menor': 'Menor de idade', '2-grave': 'Grave', '3-recurso': 'Recurso', '4-denuncias': '3+ denúncias', '5-selfie': 'Selfie',
    assedio: 'Assédio', perfil_falso: 'Perfil falso', menor_de_idade: 'Menor de idade', conteudo_sexual: 'Conteúdo sexual',
    spam_golpe: 'Spam/golpe', discurso_de_odio: 'Ódio', servico_sexual_ou_cobranca: 'Programa/cobrança', outro: 'Outro',
  };
  const pclass = (p) => ({ '1-menor': 'p1', '2-grave': 'p2', '3-recurso': 'p3' }[p] || '');

  // ------------------------------------------------------------ setup / login
  let db = null, view = 'fila', selected = null;
  const url = store.get('cm_url'), key = store.get('cm_anon');
  // FE-001: sessão do painel em sessionStorage (some ao fechar a aba), não em localStorage
  const client = (u, k) => supabase.createClient(u, k, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  if (url && key) db = client(url, key);

  function setupScreen(msg) {
    const u = h('input', { placeholder: 'https://xxxx.supabase.co', value: store.get('cm_url') || '' });
    const k = h('input', { placeholder: 'chave pública (anon)', value: store.get('cm_anon') || '' });
    $app.replaceChildren(h('div', { class: 'login card' },
      h('h2', {}, 'Conectar ao projeto'),
      h('p', { class: 'muted' }, 'Use a URL e a chave pública (anon) do Supabase. Nunca a service_role.'),
      u, k, msg ? h('p', { class: 'err' }, msg) : null,
      h('button', { class: 'primary', onclick: () => {
        if (!/^https:\/\/.+/.test(u.value) || k.value.length < 20) return setupScreen('Confira a URL e a chave.');
        store.set('cm_url', u.value.trim()); store.set('cm_anon', k.value.trim());
        db = client(u.value.trim(), k.value.trim()); loginScreen();
      } }, 'Salvar')));
  }

  function loginScreen(msg) {
    const e = h('input', { type: 'email', placeholder: 'e-mail', autocomplete: 'username' });
    const p = h('input', { type: 'password', placeholder: 'senha', autocomplete: 'current-password' });
    const go = async () => {
      const { error } = await db.auth.signInWithPassword({ email: e.value.trim(), password: p.value });
      if (error) return loginScreen('E-mail ou senha incorretos.');
      mfaStep();
    };
    p.addEventListener('keydown', (ev) => ev.key === 'Enter' && go());
    $app.replaceChildren(h('div', { class: 'login card' },
      h('h2', {}, 'Suporte ConMatch'), e, p, msg ? h('p', { class: 'err' }, msg) : null,
      h('button', { class: 'primary', onclick: go }, 'Entrar'),
      h('button', { onclick: () => setupScreen() }, 'Trocar projeto')));
  }

  // ------------------------------------------------------------ segundo fator (TOTP)
  // O banco só aceita decisões de sessão aal2 (0016). Primeiro acesso: cadastra
  // o app autenticador lendo o QR code; depois, só o código de 6 dígitos.
  async function mfaStep(msg) {
    const { data: aal } = await db.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal?.currentLevel === 'aal2') return boot();
    const { data: f, error: fe } = await db.auth.mfa.listFactors();
    if (fe) return loginScreen('Não foi possível ler o segundo fator: ' + fe.message);
    const all = f?.all || [];
    const ok = all.find((x) => x.factor_type === 'totp' && x.status === 'verified');
    const code = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6',
                              placeholder: 'código de 6 dígitos' });
    let factorId = ok?.id, extra = [];
    if (!ok) {
      for (const x of all.filter((y) => y.factor_type === 'totp' && y.status !== 'verified')) {
        await db.auth.mfa.unenroll({ factorId: x.id });
      }
      const { data: en, error } = await db.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Painel ConMatch' });
      if (error) return loginScreen('Não foi possível cadastrar o segundo fator: ' + error.message);
      factorId = en.id;
      extra = [
        h('p', { class: 'muted' }, 'Primeiro acesso: leia o QR code com o Google Authenticator, Microsoft Authenticator ou 1Password.'),
        h('img', { src: en.totp.qr_code, alt: 'QR code do segundo fator', width: '180', height: '180' }),
        h('p', { class: 'muted' }, 'Sem câmera? Digite esta chave no app: ', h('code', {}, en.totp.secret)),
      ];
    }
    const verify = async () => {
      const { error } = await db.auth.mfa.challengeAndVerify({ factorId, code: code.value.trim() });
      if (error) return mfaStep('Código incorreto ou vencido. Tente o próximo.');
      boot();
    };
    code.addEventListener('keydown', (ev) => ev.key === 'Enter' && verify());
    $app.replaceChildren(h('div', { class: 'login card' },
      h('h2', {}, 'Segundo fator'),
      ok ? h('p', { class: 'muted' }, 'Abra o app autenticador e digite o código do ConMatch.') : null,
      ...extra, code, msg ? h('p', { class: 'err' }, msg) : null,
      h('button', { class: 'primary', onclick: verify }, 'Confirmar'),
      h('button', { onclick: async () => { await db.auth.signOut(); loginScreen(); } }, 'Sair')));
    code.focus();
  }

  const rpc = async (fn, args) => {
    const { data, error } = await db.rpc(fn, args);
    if (error) throw new Error(error.message);
    return data;
  };
  const signed = async (paths) => {
    const list = (paths || []).filter(Boolean);
    if (!list.length) return {};
    const { data } = await db.storage.from('photos').createSignedUrls(list, 300);
    return Object.fromEntries((data || []).filter((x) => x.signedUrl).map((x) => [x.path, x.signedUrl]));
  };

  // ------------------------------------------------------------ app
  async function boot() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return loginScreen();
    try {
      const st = await rpc('admin_status');
      if (st.admin && !st.mfa_ok) return mfaStep();
      await render();
    }
    catch (e) {
      if (/MFA_REQUIRED/.test(e.message)) return mfaStep();
      if (/NOT_ADMIN/.test(e.message)) {
        await db.auth.signOut();
        return loginScreen('Este usuário não é admin. Cadastre em public.admins.');
      }
      $app.replaceChildren(h('p', { class: 'empty err' }, 'Erro: ' + e.message));
    }
  }

  async function render() {
    const stats = await rpc('admin_stats');
    const head = h('header', {},
      h('h1', {}, 'Con', h('em', {}, 'Match'), ' · suporte'),
      h('div', { class: 'stats' }, [
        `${stats.perfis} perfis`, `${stats.verificados} verificados`, `${stats.escondidos} escondidos`,
        `${stats.selfies_pendentes} selfies`, `${stats.denuncias_abertas} denúncias abertas`, `${stats.lista_de_espera} na lista de espera`,
      ].map((s) => h('span', {}, s))),
      h('div', { class: 'sp' }),
      h('button', { onclick: () => render() }, 'Atualizar'),
      h('button', { onclick: async () => { await db.auth.signOut(); loginScreen(); } }, 'Sair'));
    const tabs = h('nav', {},
      ['fila', 'lista'].map((v) => h('button', { class: view === v ? 'on' : '', onclick: () => { view = v; render(); } },
        v === 'fila' ? 'Fila de decisões' : 'Lista de espera')));
    const main = h('main');
    $app.replaceChildren(head, tabs, main);
    if (view === 'lista') return renderWaitlist(main);
    return renderQueue(main);
  }

  async function renderWaitlist(main) {
    main.style.gridTemplateColumns = '1fr';
    const rows = await rpc('admin_waitlist');
    main.append(h('div', { class: 'card' }, h('h2', {}, 'Lista de espera por cidade'),
      rows.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Cidade', 'Total', 'Mulheres', 'Homens'].map((t) => h('th', {}, t)))),
        h('tbody', {}, rows.map((r) => h('tr', {}, h('td', {}, `${r.cidade}/${r.estado}`), h('td', {}, r.total),
          h('td', {}, r.mulheres), h('td', {}, r.homens)))))
        : h('p', { class: 'empty' }, 'Ninguém na lista ainda.')));
  }

  async function renderQueue(main) {
    main.style.gridTemplateColumns = '';
    const queue = await rpc('admin_queue');
    const listBox = h('div', { class: 'list' });
    const detail = h('div', { class: 'card' }, h('p', { class: 'empty' }, queue.length ? 'Escolha um caso.' : 'Nada para decidir agora.'));
    for (const q of queue) {
      const id = q.tipo === 'selfie' ? 'v' + q.request_id : 'u' + q.user_id;
      const btn = h('button', { class: 'item' + (selected === id ? ' on' : ''), onclick: () => { selected = id; openCase(q, detail); markOn(); } },
        h('div', { class: 'row' }, h('span', { class: 'pill ' + pclass(q.prioridade) }, LABEL[q.prioridade] || q.prioridade),
          h('span', { class: 'muted' }, fmt(q.desde))),
        h('strong', {}, q.tipo === 'selfie' ? 'Selfie de verificação' : (q.nome || 'Perfil')),
        q.tipo === 'perfil' ? h('span', { class: 'muted' },
          `${q.denuncias} denúncia(s) · ${(q.motivos || []).map((m) => LABEL[m] || m).join(', ')}`) : null);
      btn.dataset.id = id;
      listBox.append(btn);
    }
    const markOn = () => listBox.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === selected));
    main.append(h('div', {}, h('h3', { style: 'margin-top:0' }, `Fila (${queue.length})`), listBox), detail);
    const again = queue.find((q) => (q.tipo === 'selfie' ? 'v' + q.request_id : 'u' + q.user_id) === selected);
    if (again) openCase(again, detail);
  }

  async function openCase(q, box) {
    box.replaceChildren(h('p', { class: 'empty' }, 'Carregando…'));
    const c = await rpc('admin_case', { p_user: q.user_id });
    const v = c.verificacao;
    const urls = await signed([...(c.fotos || []).map((f) => f.path), v?.selfie]);
    const p = c.profile;
    const note = h('textarea', { rows: 2, placeholder: 'Motivo da decisão (fica registrado)' });
    const out = h('p', { class: 'err' });
    const act = (fn) => async () => {
      try { await fn(); selected = null; await render(); }
      catch (e) { out.textContent = e.message.includes('NOTE_REQUIRED') ? 'Escreva o motivo.' : e.message; }
    };

    box.replaceChildren(
      h('h2', {}, `${p.nome}, ${p.idade}`),
      h('p', { class: 'muted' }, `${p.cidade} · ${p.verificado ? 'verificado ✓' : 'não verificado'} · conta de ${fmt(p.criado_em)}`
        + (p.escondido_desde ? ` · escondido desde ${fmt(p.escondido_desde)}` : '')),
      p.bio ? h('p', {}, '“', p.bio, '”') : null,
      h('h3', {}, q.tipo === 'selfie' ? 'Selfie × fotos do perfil' : 'Fotos'),
      h('div', { class: 'photos' },
        q.tipo === 'selfie' && v?.selfie ? h('figure', {}, h('img', { src: urls[v.selfie] || '', alt: 'Selfie' }),
          h('figcaption', {}, 'Selfie · pedido: ' + (v.gesto || '—'))) : null,
        (c.fotos || []).map((f, i) => h('figure', {}, h('img', { src: urls[f.path] || '', alt: 'Foto ' + (i + 1) }),
          h('figcaption', {}, f.aprovada ? `Foto ${i + 1}` : `Foto ${i + 1} (reprovada)`)))),
    );

    if (q.tipo === 'selfie') {
      // Depois de decidir, a selfie é apagada (dado biométrico: guardamos só o resultado)
      const decide = (approve) => act(async () => {
        await rpc('admin_review_selfie', { p_request: q.request_id, p_approve: approve,
          p_note: note.value || (approve ? null : 'Não foi possível confirmar que é você.') });
        if (v?.selfie) await db.storage.from('photos').remove([v.selfie]);
      });
      box.append(h('h3', {}, 'Decisão'), note, out, h('div', { class: 'row' },
        h('button', { class: 'okb', onclick: decide(true) }, 'Aprovar: é a mesma pessoa'),
        h('button', { class: 'danger', onclick: decide(false) }, 'Recusar')),
        h('p', { class: 'muted' }, 'A selfie é apagada assim que você decide.'));
      return;
    }

    box.append(h('h3', {}, `Denúncias (${c.denuncias.length})`));
    for (const r of c.denuncias) {
      const msgs = r.evidencia?.messages || [];
      box.append(h('div', { class: 'report' },
        h('div', { class: 'row' }, h('span', { class: 'pill' }, LABEL[r.motivo] || r.motivo),
          r.gravidade ? h('span', { class: 'pill ' + (r.gravidade === 'grave' ? 'p2' : '') }, 'robô: ' + r.gravidade.replace('_', ' ')) : null,
          (r.sinais || []).length ? h('span', { class: 'muted' }, 'sinais: ' + r.sinais.join(', ')) : null,
          h('span', { class: 'muted' }, `${r.status} · ${fmt(r.em)}`)),
        r.detalhes ? h('p', {}, 'Relato: ', r.detalhes) : null,
        r.evidencia?.like_message ? h('p', { class: 'muted' }, 'Recado da curtida: “', r.evidencia.like_message, '”') : null,
        msgs.length ? h('p', { class: 'muted', style: 'margin:4px 0' }, 'À esquerda: pessoa denunciada · à direita: quem denunciou') : null,
        msgs.length ? h('div', { class: 'chat' }, msgs.map((m) => h('div', { class: 'msg ' + (m.from === 'denunciado' ? 'r' : 'd') }, m.body)))
          : h('p', { class: 'muted' }, 'Sem conversa guardada.')));
    }
    if ((c.recursos || []).length) {
      box.append(h('h3', {}, 'Versão da pessoa'), ...c.recursos.map((a) => h('p', {}, `“${a.mensagem}” `, h('span', { class: 'muted' }, `(${a.status}, ${fmt(a.em)})`))));
    }
    box.append(h('h3', {}, 'Decisão'), note, out, h('div', { class: 'row' },
      h('button', { class: 'okb', onclick: act(() => rpc('admin_resolve', { p_user: q.user_id, p_decision: 'restaurar', p_note: note.value })) }, 'Restaurar perfil'),
      h('button', { class: 'danger', onclick: act(() => rpc('admin_resolve', { p_user: q.user_id, p_decision: 'banir', p_note: note.value })) }, 'Banir')),
      h('p', { class: 'muted' }, 'Na fila, o vermelho aparece primeiro: menor de idade, depois casos graves. A pessoa denunciada continua escondida até você decidir.'));
  }

  db ? boot() : setupScreen();
})();
</script>
</body>
</html>
