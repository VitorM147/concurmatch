name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio para o GITHUB_TOKEN (ESAA-Security DO-002)
# Actions fixadas por SHA de commit (DS-005): uma tag movida não troca o código que roda aqui.
# O Dependabot (github-actions) continua propondo as atualizações.
permissions:
  contents: read

jobs:
  database:
    name: Regras do banco + regressões de segurança (PGlite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: supabase/tests } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: supabase/tests/package-lock.json }
      - run: npm ci                      # DS-006: build reproduzível pelo lockfile
      - run: npm test                    # inclui security.test.mjs (provas de conceito da auditoria)

  mobile:
    name: App (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  audit-trail:
    name: Trilha da auditoria ESAA (replay + SHA-256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 security/tools/esaa_project.py verify

  secrets:
    name: Secrets scanning (gitleaks)      # DO-003 / SC-001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }           # varre o histórico inteiro
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Site e painel (cabeçalhos de segurança)   # SH-001..005
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Falha se um <script> inline mudou e a CSP (hashes) não foi regenerada
      - run: python3 apps/security-headers.py --check

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/report-triage/index.ts supabase/functions/selfie-check/index.ts

  sast:
    name: SAST (Semgrep)                   # DO-004
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config p/typescript --config p/javascript --config p/react --config p/secrets --error --metrics=off

  dependencies:
    name: Dependências (npm audit)         # DS-001 / FE-003
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: [apps/mobile, supabase/tests] }
    defaults: { run: { working-directory: '${{ matrix.dir }}' } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Bloqueia CRITICAL. Os HIGH restantes são de ferramentas de build sem
      # versão corrigida publicada e estão aceitos com prazo em SECURITY.md.
      - run: npm audit --audit-level=critical
