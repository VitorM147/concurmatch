# =====================================================================
# Supabase — configuração versionada de Auth (ESAA-Security: AU, SS, BL-002)
# Usada pela Supabase CLI (`supabase start` / `supabase config push`).
# No projeto hospedado, confira os mesmos valores em Authentication → Settings.
# Segredos NUNCA ficam aqui: use env(...) e defina no ambiente/CI.
# =====================================================================
project_id = "conmatch"

[auth]
enabled = true
site_url = "conmatch://"
additional_redirect_urls = ["conmatch://**"]
# AU-005 / SS-005 — access token curto (1 h)
jwt_expiry = 3600
# SS-006 / AU-007 — refresh token rotativo: token usado duas vezes revoga a sessão
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Senha forte (o app também exige 8+, mas a regra que vale é a do servidor)
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# AU-006 — brute force e abuso de e-mail
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

# BL-002 — CAPTCHA no cadastro/login (Cloudflare Turnstile).
# Desligado até o app enviar o captchaToken no signUp/signIn (ver SECURITY.md).
# Ligar antes da campanha de anúncios.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
# AP-003 — com confirmação ligada, o cadastro não revela se o e-mail já existe
enable_confirmations = true
double_confirm_changes = true
# AU-004 — troca de senha exige sessão recente
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

# AU-003 — MFA por app autenticador (TOTP) disponível para quem quiser ativar
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "5MiB"

# Robô de triagem de denúncias: chamado pelo pg_cron com o cabeçalho
# x-worker-secret (REPORT_TRIAGE_SECRET), não com JWT de usuário.
[functions.report-triage]
verify_jwt = false
